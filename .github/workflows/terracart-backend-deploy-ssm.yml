name: Retired unsafe SSM deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse legacy in-place deployment
        run: |
          echo 'Legacy SSM git-pull deployment is retired. See CI_CD.md and use protected artifact deployment after transport verification.'
          exit 1
