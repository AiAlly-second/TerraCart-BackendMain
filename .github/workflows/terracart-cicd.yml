name: TerraCart Backend CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show repo files
        run: |
          pwd
          ls -la

      - name: Install backend dependencies
        run: npm install
